# ML4T 3rd Edition — CI Test Workflow
#
# Tests notebooks inside pre-built Docker images (ml4t/ml4t:latest).
# This ensures CI tests exactly what readers will use.
#
# Architecture:
#   - All notebook tests run inside Docker containers (not native Python)
#   - Incremental: dorny/paths-filter only tests changed chapters
#   - Pre-built images from Docker Hub (built by docker-publish.yml)
#   - Special images for py312 (signatory/gensim/tfcausalimpact), Neo4j, benchmarks
#
# Trigger policy:
#   - PR: incremental (path-filtered, only changed chapters)
#   - Push to main: full suite
#   - Weekly: full suite on schedule (Monday 6 AM UTC)
#   - After Docker Publish: full suite (workflow_run trigger)
#   - Manual: workflow_dispatch with optional run_all flag
#
# Push to main was previously NOT triggered, to conserve minutes. Exports land on
# main as pushes, so nothing CI ran had ever seen what shipped: issue #372 (59 of
# 122 shipped notebooks would not open in JupyterLab) reached a reader through
# that gap, and the weekly cron is up to 7 days late. Every push to main now
# runs the full matrix so failures outside a merged diff remain visible.

name: Tests

# One run per ref, and a burst collapses to the newest tree. Merging eight pull requests in an
# evening previously started eight full matrices on `main`, each testing a tree the next merge
# superseded minutes later, and each mailing a failure notice. Cancelling the superseded ones
# keeps the invariant the push trigger exists for - what is on `main` has been tested - while
# testing the tip rather than every intermediate state. Pull-request runs collapse the same way
# when a branch is pushed to repeatedly.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Weekly Monday 6 AM UTC
  workflow_run:
    workflows: ["Docker Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run all tests (ignore path filters)"
        type: boolean
        default: false
      test_filter:
        description: "pytest -k filter (e.g. 'us_equities_panel or nasdaq100' to run only those)"
        type: string
        default: ""

env:
  ML4T_DATA_PATH: ${{ github.workspace }}/test-data/data
  ML4T_OUTPUT_DIR: /tmp/ml4t-test-output
  MPLBACKEND: Agg
  PLOTLY_RENDERER: json

jobs:
  # ---------------------------------------------------------------------------
  # Detect which paths changed and build dynamic matrices
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chapter_matrix: ${{ steps.build.outputs.chapter_matrix }}
      case_matrix: ${{ steps.build.outputs.case_matrix }}
      run_py312: ${{ steps.build.outputs.run_py312 }}
      run_neo4j: ${{ steps.build.outputs.run_neo4j }}
      run_benchmark: ${{ steps.build.outputs.run_benchmark }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # "shared" fans the matrix out to every chapter and every case study.
            # Only files that can change what test-chapters or test-case-studies
            # DO belong here. Those two jobs run exactly one test module each
            # (test_chapter_notebooks.py, test_case_studies.py), and the harness
            # they import is conftest -> preset_patches and pm_helpers ->
            # overrides.yaml. The other ~100 files in tests/ are unit tests owned
            # by test-unit, which is required and runs on every commit anyway, so
            # listing 'tests/**' here re-ran nine notebook pipelines to re-test
            # something that had already been tested in ninety seconds.
            shared:
              - 'utils/**'
              - 'data/**'
              - 'pyproject.toml'
              - '.github/workflows/test.yml'
              - 'matplotlibrc'
              - 'tests/__init__.py'
              - 'tests/conftest.py'
              - 'tests/pm_helpers.py'
              - 'tests/preset_patches.py'
              - 'tests/overrides.yaml'
              - 'tests/fixtures/**'
              - 'tests/test_case_studies.py'
              - 'tests/test_chapter_notebooks.py'
            # test-py312, test-neo4j and test-benchmark all run this module. It is
            # not in `shared` because it drives none of the chapter or case-study
            # matrix; it gets its own filter, wired into run_py312 below.
            docker-notebooks:
              - 'tests/test_docker_notebooks.py'
            ch01:
              - '01_process_is_edge/**'
            ch02-03:
              - '02_financial_data_universe/**'
              - '03_market_microstructure/**'
              - 'data/**'
            ch04:
              - '04_fundamental_alternative_data/**'
            ch05:
              - '05_synthetic_data/**'
            ch06-07:
              - '06_strategy_definition/**'
              - '07_defining_the_learning_task/**'
            ch08-09:
              - '08_financial_features/**'
              - '09_model_based_features/**'
            ch10:
              - '10_text_feature_engineering/**'
            ch11-12:
              - '11_ml_pipeline/**'
              - '12_gradient_boosting/**'
            ch13:
              - '13_dl_time_series/**'
            ch14-15:
              - '14_latent_factors/**'
              - '15_causal_estimation/**'
            ch16-17:
              - '16_strategy_simulation/**'
              - '17_portfolio_construction/**'
            ch18-20:
              - '18_transaction_costs/**'
              - '19_risk_management/**'
              - '20_strategy_synthesis/**'
            ch21:
              - '21_rl_execution_hedging/**'
            ch22:
              - '22_rag_financial_research/**'
            ch23:
              - '23_knowledge_graphs/**'
            ch24:
              - '24_autonomous_agents/**'
            ch25:
              - '25_live_trading/**'
            ch26:
              - '26_mlops_governance/**'
            cs-etfs:
              - 'case_studies/etfs/**'
            cs-crypto:
              - 'case_studies/crypto_perps_funding/**'
            cs-nasdaq:
              - 'case_studies/nasdaq100_microstructure/**'
            cs-sp500eoa:
              - 'case_studies/sp500_equity_option_analytics/**'
            cs-firmchar:
              - 'case_studies/us_firm_characteristics/**'
            cs-fx:
              - 'case_studies/fx_pairs/**'
            cs-futures:
              - 'case_studies/cme_futures/**'
            cs-sp500opt:
              - 'case_studies/sp500_options/**'
            cs-usequity:
              - 'case_studies/us_equities_panel/**'

      - name: Build dynamic matrices
        id: build
        run: |
          shared="${{ steps.filter.outputs.shared }}"
          schedule="${{ github.event_name == 'schedule' }}"
          after_docker="${{ github.event_name == 'workflow_run' }}"
          run_all="${{ github.event.inputs.run_all }}"
          # A push to `main` runs the whole matrix, unfiltered. The path filter is
          # a PR economy: it skips jobs a PR's diff cannot have broken. On `main`
          # that economy buys nothing and costs the signal - a typical push
          # touches no shared path, so ~26 of 28 jobs were skipped and the green
          # badge reported on the one or two that ran. Ten notebook jobs were
          # failing on `main` for a long time with nothing to report it.
          main_push="${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}"
          all="false"
          if [[ "$shared" == "true" ]] || [[ "$schedule" == "true" ]] || [[ "$run_all" == "true" ]] || [[ "$after_docker" == "true" ]] || [[ "$main_push" == "true" ]]; then
            all="true"
          fi

          # --- Chapter matrix (all chapters including Ch01 and Ch05) ---
          chapters="[]"
          # Public-subset scoping: include a chapter only if at least one of its
          # NN_* directories is actually present. The public repo ships chapters
          # incrementally (beat by beat), so this auto-scopes the matrix to what
          # is shipped — no per-beat workflow edits, and unshipped chapters can't
          # fail with "no tests collected".
          add_ch() {
            local n="$1" f="$2" p
            for p in $(echo "$f" | grep -oE '[0-9]{2}_' || true); do
              if compgen -G "${p}*" >/dev/null 2>&1; then
                chapters=$(echo "$chapters" | jq -c --arg n "$n" --arg f "$f" '. + [{"name":$n,"filter":$f}]')
                return
              fi
            done
          }

          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch01 }}" == "true" ]]; then
            add_ch "ch01" "01_process"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch02-03 }}" == "true" ]]; then
            add_ch "ch02-03" "02_financial or 03_market"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch04 }}" == "true" ]]; then
            add_ch "ch04" "04_fundamental"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch05 }}" == "true" ]]; then
            add_ch "ch05" "05_synthetic"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch06-07 }}" == "true" ]]; then
            add_ch "ch06-07" "06_strategy or 07_defining"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch08-09 }}" == "true" ]]; then
            add_ch "ch08-09" "08_financial or 09_model"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch10 }}" == "true" ]]; then
            add_ch "ch10" "10_text"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch11-12 }}" == "true" ]]; then
            add_ch "ch11-12" "11_ml_pipeline or 12_gradient"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch13 }}" == "true" ]]; then
            add_ch "ch13" "13_dl_time"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch14-15 }}" == "true" ]]; then
            add_ch "ch14-15" "14_latent or 15_causal"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch16-17 }}" == "true" ]]; then
            add_ch "ch16-17" "16_strategy or 17_portfolio"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch18-20 }}" == "true" ]]; then
            add_ch "ch18-20" "18_transaction or 19_risk or 20_strategy"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch21 }}" == "true" ]]; then
            add_ch "ch21" "21_rl"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch22 }}" == "true" ]]; then
            add_ch "ch22" "22_rag"
          fi
          # Ch23 skipped — requires Neo4j service (tested in test-neo4j when ready)
          # if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch23 }}" == "true" ]]; then
          #   add_ch "ch23" "23_knowledge"
          # fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch24 }}" == "true" ]]; then
            add_ch "ch24" "24_autonomous"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch25 }}" == "true" ]]; then
            add_ch "ch25" "25_live"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.ch26 }}" == "true" ]]; then
            add_ch "ch26" "26_mlops"
          fi

          echo "chapter_matrix=$chapters" >> "$GITHUB_OUTPUT"

          # --- Py312 flag ---
          run_py312="false"
          if [[ "$all" == "true" ]] \
             || [[ "${{ steps.filter.outputs.ch05 }}" == "true" ]] \
             || [[ "${{ steps.filter.outputs.ch08-09 }}" == "true" ]] \
             || [[ "${{ steps.filter.outputs.ch10 }}" == "true" ]] \
             || [[ "${{ steps.filter.outputs.ch14-15 }}" == "true" ]] \
             || [[ "${{ steps.filter.outputs.docker-notebooks }}" == "true" ]]; then
            run_py312="true"
          fi
          echo "run_py312=$run_py312" >> "$GITHUB_OUTPUT"

          # --- Neo4j flag (needs populated Neo4j — skip until infra is ready) ---
          run_neo4j="false"
          echo "run_neo4j=$run_neo4j" >> "$GITHUB_OUTPUT"

          # --- Benchmark flag (disabled — QuestDB container fails health check in CI) ---
          run_benchmark="false"
          echo "run_benchmark=$run_benchmark" >> "$GITHUB_OUTPUT"

          # --- Case study matrix ---
          cases="[]"
          # Public repo ships case-study CONFIG but gates the pipeline code.
          # test_case_studies.py auto-discovers stages by globbing
          # case_studies/<cs>/[0-9][0-9]*.py, and the results registry is seeded
          # from the test-data repo at run time (NOT shipped to this repo). So
          # gate on the same signal the test collects: enroll a case study only
          # once its pipeline notebooks are shipped here — currently only
          # config/setup.yaml ships, so case-study jobs stay skipped. Future
          # beats that ship the notebooks auto-enroll, no workflow edits.
          add_cs() {
            if compgen -G "case_studies/$1/[0-9][0-9]*.py" >/dev/null 2>&1; then
              cases=$(echo "$cases" | jq -c --arg cs "$1" '. + [{"case-study":$cs}]')
            fi
          }

          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-etfs }}" == "true" ]]; then
            add_cs "etfs"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-crypto }}" == "true" ]]; then
            add_cs "crypto_perps_funding"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-nasdaq }}" == "true" ]]; then
            add_cs "nasdaq100_microstructure"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-sp500eoa }}" == "true" ]]; then
            add_cs "sp500_equity_option_analytics"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-firmchar }}" == "true" ]]; then
            add_cs "us_firm_characteristics"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-fx }}" == "true" ]]; then
            add_cs "fx_pairs"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-futures }}" == "true" ]]; then
            add_cs "cme_futures"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-sp500opt }}" == "true" ]]; then
            add_cs "sp500_options"
          fi
          if [[ "$all" == "true" ]] || [[ "${{ steps.filter.outputs.cs-usequity }}" == "true" ]]; then
            add_cs "us_equities_panel"
          fi

          echo "case_matrix=$cases" >> "$GITHUB_OUTPUT"

          echo "Chapters: $chapters"
          echo "Cases: $cases"
          echo "Py312: $run_py312"
          echo "Neo4j: $run_neo4j"
          echo "Benchmark: $run_benchmark"

  # ---------------------------------------------------------------------------
  # Lint (always runs, fast)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      # Same version as pyproject.toml's dev extra and .pre-commit-config.yaml;
      # tests/test_toolchain_pins.py fails when any of the three drift.
      - name: Ruff check
        run: uvx ruff@0.15.14 check utils/ data/ tests/
      - name: Ruff format
        run: uvx ruff@0.15.14 format --check utils/ data/ tests/

  # ---------------------------------------------------------------------------
  # Reader-facing guards. Always-on, never path-filtered, no Docker, ~1 minute.
  #
  # Every other job in this workflow asks "does the notebook run?". None asked
  # "can a reader open it?" — so issue #372 was invisible to the entire suite
  # while 59 of 122 shipped notebooks raised File Load Error in JupyterLab.
  #
  # check_notebook_pair_sync.py is that missing check, and it already existed:
  # it was wired into .pre-commit-config.yaml only, so it gated commits and not
  # pushes. Exports reach main as pushes. This job is where it actually gates.
  #
  # Unfiltered by design: a desynced pair is caused by tooling that touches many
  # chapters at once (papermill metadata, ruff-format, a partial export), so
  # "only test what changed" is precisely the wrong scope for it.
  # ---------------------------------------------------------------------------
  guards:
    name: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      # A path Windows cannot represent makes the whole repo unclonable there,
      # not just that file (#433). Stdlib-only and instant, so it runs before
      # anything is installed.
      - name: Every tracked path is checkout-able on Windows (#433 regression gate)
        run: python .github/scripts/check_windows_safe_paths.py
      - name: Install guard deps
        # jupytext only: check_notebook_pair_sync.py shells out to the `jupytext`
        # binary, so it must be on PATH. Deliberately not the project env — this
        # stays a ~1-minute gate.
        run: |
          uv venv --python 3.14
          uv pip install jupytext==1.19.3 pytest nbformat
      - name: Notebook pairs open in JupyterLab (#372 regression gate)
        run: |
          source .venv/bin/activate
          python .github/scripts/check_notebook_pair_sync.py
      # Chapter 21 shipped two notebooks importing helper modules that were
      # never committed, so every reader hit ModuleNotFoundError. This is a
      # purely static check (no imports executed, nothing installed), which is
      # why it belongs in this fast job rather than inside a built image.
      - name: Every import resolves to a file or a declared dependency
        run: |
          source .venv/bin/activate
          python .github/scripts/check_import_resolution.py
      - name: Notebook output hygiene
        run: |
          source .venv/bin/activate
          python -m pytest tests/test_notebook_output_hygiene.py -q

  # ---------------------------------------------------------------------------
  # Fast native unit tests — download-script logic (no Docker, no network,
  # no test-data, no secrets). Seconds per PR.
  #
  # Notebook tests run against pre-seeded data, so the data/**/download.py code
  # path is invisible to them — this is how the in-container free-data download
  # bug (#361) reached readers. These tests exercise that logic directly:
  # path resolution / output placement, download_all dispatch modes, the
  # firm-characteristics archive flatten, download-script registry drift, the
  # compose /data-mount contract (static regression-lock for #361), and the
  # drift-coverage ratchet (every free dataset keeps a live external smoke).
  # The networked container smoke (Phase 2b) and live drift pulls (Phase 3) run
  # in container-smoke.yml / weekly-external.yml, not here.
  # ---------------------------------------------------------------------------
  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install minimal test deps
        # Just the import surface of the tests in this job (utils/downloading +
        # data/download_all + firm-char extract_zip, plus gymnasium for the
        # Chapter 21 environments). Intentionally NOT the full project env (no
        # torch/ml4t-*) so this stays a fast per-commit gate.
        #
        # requests is here for the fixture-generator tests: create_test_data
        # validates the 13F artifacts by rebuilding them with the producer's own
        # build_features_and_matrix, and 13f_download.py imports requests at
        # module scope. Nothing in this job makes a network call.
        #
        # scipy/statsmodels/scikit-learn are the import surface of
        # case_studies/utils/causal.py, so the p-value tail test can actually
        # run its numeric case rather than skipping past the behavior it pins.
        #
        # matplotlib and hmmlearn are the import surface of the shared stage-03
        # and stage-04 helpers below. Neither pulls torch or an ml4t-* package,
        # so this stays a fast per-commit gate.
        #
        # pyarrow is what polars converts through in `DataFrame.to_pandas`, which
        # `load_modeling_dataset` calls on the fold-tagged temporal artifact. The
        # variant-geometry guard hangs off exactly that frame, so without pyarrow
        # the tests that establish the guard runs on a real load fail at the
        # conversion rather than at the property. Found by this job, not by
        # inspection: the helper-level tests never reach the conversion and passed.
        run: |
          uv venv --python 3.14
          uv pip install pytest numpy pandas polars pyyaml python-dotenv plotly gymnasium requests \
            scipy statsmodels scikit-learn matplotlib hmmlearn pyarrow \
            "ml4t-diagnostic>=0.1.0"
      - name: Run download-logic unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Override the workflow-level test-data path: this job checks out no
          # test-data. utils.config validates ML4T_DATA_PATH exists at import and
          # reads the env var ahead of .env, so point both at the repo's own dirs.
          ML4T_PATH: ${{ github.workspace }}
          ML4T_DATA_PATH: ${{ github.workspace }}/data
        run: |
          # utils.config also requires a .env file to exist; create a minimal one.
          printf 'ML4T_PATH=%s\nML4T_DATA_PATH=%s/data\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > .env
          .venv/bin/python -m pytest \
            tests/test_download_helpers.py \
            tests/test_firm_characteristics_extract.py \
            tests/test_download_all_dispatch.py \
            tests/test_download_scripts_registry.py \
            tests/test_compose_mounts.py \
            tests/test_download_coverage.py \
            tests/test_plotly_renderer.py \
            -v --tb=short
      # The Chapter 21 environments reached readers as broken imports partly
      # because no job ran the tests that name them: test_import_coverage.py
      # listed both notebooks while nothing invoked it. These two files pin the
      # restored environments and the behavior of the import guard the `guards`
      # job executes, so they gate every PR from here.
      - name: Run Chapter 21 environment and import-guard tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m pytest \
            tests/test_ch21_rl_environments.py \
            tests/test_import_resolution.py \
            tests/test_import_coverage.py::test_scanner_excludes_repository_scripts \
            tests/test_import_coverage.py::test_okx_sdk_is_classified_in_reader_image \
            -v --tb=short
      # The harness that decides which notebooks run, and the subsampler that
      # builds the fixtures they run against. Both were ungated: the fixture
      # regeneration path had not been runnable for months without anything
      # going red, and a notebook could be marked skip on a credential the
      # weekly workflow supplies without anything noticing.
      - name: Run test-harness and fixture-generator tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Same override as the download-logic step above, and for the same
          # reason: create_test_data imports the production producers, which
          # pulls in utils.config, which hard-fails at import when
          # ML4T_DATA_PATH does not exist. This job checks out no test-data, so
          # the workflow-level default points at a directory that is not there.
          # The tests build their own synthetic sources under tmp_path and read
          # nothing from this path.
          ML4T_PATH: ${{ github.workspace }}
          ML4T_DATA_PATH: ${{ github.workspace }}/data
        run: |
          .venv/bin/python -m pytest \
            tests/test_pm_helpers.py \
            tests/test_create_test_data.py \
            tests/test_sample_registry_for_tests.py \
            tests/test_toolchain_pins.py \
            -v --tb=short
      # A two-tailed p-value written as `2 * (1 - dist.cdf(abs(t)))` returns
      # exactly 0.0 above |t| ~8.35, so a notebook teaching inference printed
      # `p=0` for a number no computation produced. `dist.sf` is the correct
      # call. Two halves, both needed: the numeric case pins the behavior of
      # the DML HAC p-value that reaches the registry, and the static scan
      # catches the expression coming back — it is reintroduced by copying it
      # from one chapter into another, so the scan is unfiltered by path.
      - name: No tail probability computed as 1 - cdf
        env:
          PYTHONPATH: ${{ github.workspace }}
          ML4T_PATH: ${{ github.workspace }}
          ML4T_DATA_PATH: ${{ github.workspace }}/data
        run: |
          .venv/bin/python -m pytest tests/test_pvalue_tail_precision.py -v --tb=short

      # The helpers the case-study stages share. One defect in any of these is a
      # defect in eight rendered notebooks at once, which is exactly why they are
      # fixed centrally rather than per notebook - and why the fix needs a gate
      # rather than trusting that eight re-runs would catch a regression.
      #
      # The last three are the guards over what load_modeling_dataset returns,
      # and adding them here is the point rather than tidiness. Both
      # assert_variant_folds_are_out_of_sample and verify_artifact_sidecars
      # shipped with tests that no job invoked, which is the same shape as the
      # defect they were written to catch: a check nothing runs establishes
      # nothing. They need no data and no ml4t-* package - every ml4t import in
      # utils/cv_splits.py is inside a function, and these tests substitute the
      # functions that reach them.
      - name: Run shared case-study helper tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          ML4T_PATH: ${{ github.workspace }}
          ML4T_DATA_PATH: ${{ github.workspace }}/data
          MPLBACKEND: Agg
        run: |
          .venv/bin/python -m pytest \
            tests/test_data_quality.py \
            tests/test_feature_engineering_figures.py \
            tests/test_temporal.py \
            tests/test_cv_splits.py \
            tests/test_cv_result_assembly.py \
            tests/test_ipca_production_config.py \
            tests/test_registry_cleanup.py \
            tests/test_registry_metric_schema.py \
            tests/test_registry_metric_horizon.py \
            tests/test_temporal_artifact_is_read_by_fold.py \
            tests/test_feature_storage_dtype.py \
            tests/test_sp500_options_evaluation_fold_alignment.py \
            tests/test_variant_fold_geometry.py \
            tests/test_artifact_sidecar_verification.py \
            tests/test_artifact_digest.py \
            -v --tb=short

      # Reads only committed notebook JSON and its paired .py, so it belongs to
      # the fast per-commit gate rather than to a job that needs data. What it
      # holds is the state a 44-notebook re-execution depends on: a pair without
      # cell_metadata_filter desyncs on the run, and the notebook-sync gate then
      # refuses every commit in the repo, not only that notebook's.
      - name: Every stage 01-05 notebook pair survives a re-execution
        run: |
          .venv/bin/python -m pytest \
            tests/test_notebook_pair_metadata_filter.py \
            -q --tb=short

      # The order us_equities_panel/03 builds its features in: per-symbol
      # windows on the complete price series, then the eligibility screen, then
      # the cross-sectional ranks. Built the other way round, a "252-session"
      # lookback counts 252 *eligible* rows and silently reaches back over a
      # stock's absence from the universe. The fix landed months ago; this file
      # is the guard, and it was written on a branch and never reached main, so
      # nothing has been checking the property since. It parses the notebook and
      # runs its functions over a synthetic panel, so it needs no data.
      - name: us_equities_panel builds features in the order the screen requires
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          .venv/bin/python -m pytest \
            tests/test_us_equities_panel_feature_ordering.py \
            -q --tb=short

      # The methodology ratchet. Both files are static AST/source scans over the
      # notebook tree, so they need no data and no model deps, and both were
      # ungated: nothing invoked either one. The cost of that showed up the first
      # time they were run from CI's perspective — the random-split bucket still
      # listed an occurrence that no longer exists in the source, which is the
      # ratchet's own staleness check firing after the drift, not before it.
      # A leak-shaped call added to any notebook now fails the PR that adds it.
      - name: Run leakage and holdout-boundary detectors
        env:
          PYTHONPATH: ${{ github.workspace }}
          ML4T_PATH: ${{ github.workspace }}
          ML4T_DATA_PATH: ${{ github.workspace }}/data
        run: |
          .venv/bin/python -m pytest \
            tests/test_leakage_detectors.py \
            tests/test_holdout_boundary.py \
            -v --tb=short

      # Where every entry point in the repo looks for data. Forty tests covered
      # the rule and no job ran any of them, so the contract was unguarded on
      # every PR — found when adding the linked-worktree fallback turned three
      # of them red and CI stayed green, because the failure only appears in a
      # worktree and the file did not run anywhere anyway.
      #
      # The precondition is the load-bearing half. `anchor_ran` skips rather
      # than fails when the startup hook did not load, which is right locally
      # (Debian's own sitecustomize.py shadows this one on a system-interpreter
      # venv) and wrong here: it would turn the whole step green while testing
      # nothing. Asserting the same condition the fixture skips on makes that
      # state red instead. It has to be the hook FIRING, not the module being
      # importable — cwd is on sys.path, so `import sitecustomize` succeeds in
      # the workspace whether or not anything ran it at startup.
      - name: Run data-root anchoring contract
        env:
          PYTHONPATH: ${{ github.workspace }}
          ML4T_PATH: ${{ github.workspace }}
          ML4T_DATA_PATH: ${{ github.workspace }}/data
        run: |
          .venv/bin/python - <<'PY'
          import os, subprocess, sys
          env = {k: v for k, v in os.environ.items() if k != "ML4T_DATA_PATH"}
          out = subprocess.run(
              [sys.executable, "-c", "import os; print(os.environ.get('ML4T_DATA_PATH', ''))"],
              env=env, cwd=os.environ["ML4T_PATH"], capture_output=True, text=True,
          )
          if not out.stdout.strip():
              sys.exit("sitecustomize did not run at startup; every test below would skip")
          print("startup hook ran ->", out.stdout.strip())
          PY
          .venv/bin/python -m pytest \
            tests/test_data_root_anchor.py \
            tests/test_sitecustomize_data_root.py \
            -v --tb=short -rs

  # ---------------------------------------------------------------------------
  # Chapter notebook tests — inside Docker (ml4t/ml4t:latest)
  #
  # Runs the same Python 3.14 environment that readers use.
  # Notebooks needing signatory/gensim/esig/tfcausalimpact are skipped here,
  # tested in test-py312 instead.
  # ---------------------------------------------------------------------------
  test-chapters:
    name: ${{ matrix.name }}
    timeout-minutes: 60
    needs: [lint, changes]
    if: needs.changes.outputs.chapter_matrix != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.chapter_matrix) }}

    runs-on: ubuntu-latest
    container:
      image: ml4t/ml4t:latest

    steps:
      - name: Install git (for checkout inside container)
        run: apt-get update -qq && apt-get install -y -qq git git-lfs openssh-client >/dev/null

      - uses: actions/checkout@v6

      - name: Checkout test data
        uses: actions/checkout@v6
        with:
          repository: ml4t/third-edition-test-data
          path: test-data
          ssh-key: ${{ secrets.TEST_DATA_DEPLOY_KEY }}
          lfs: false

      - name: Seed case study intermediates
        run: |
          mkdir -p $ML4T_OUTPUT_DIR
          if [ -d test-data/intermediates ]; then
            cp -r test-data/intermediates/* $ML4T_OUTPUT_DIR/
            echo "Seeded $(du -sh $ML4T_OUTPUT_DIR | cut -f1) of intermediates"
          fi
          # Ch20 outputs go to repo dir (get_chapter_dir doesn't redirect)
          if [ -d test-data/intermediates/ch20_synthesis/output ]; then
            mkdir -p 20_strategy_synthesis/output
            cp test-data/intermediates/ch20_synthesis/output/* 20_strategy_synthesis/output/
            echo "Seeded Ch20 synthesis outputs"
          fi
          # Ch24/11 research_operator: artifacts dir is gitignored in this repo;
          # source them from test-data into the notebook dir.
          if [ -d test-data/data/autonomous_agents/operator_artifacts ]; then
            mkdir -p 24_autonomous_agents/operator_artifacts
            cp test-data/data/autonomous_agents/operator_artifacts/*.json \
              24_autonomous_agents/operator_artifacts/
            echo "Seeded ch24/11 operator artifacts"
          fi

      - name: Run chapter notebooks (${{ matrix.name }})
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_FILTER_INPUT: ${{ github.event.inputs.test_filter }}
          MATRIX_FILTER: ${{ matrix.filter }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          FILTER="${TEST_FILTER_INPUT:-$MATRIX_FILTER}"
          python -m pytest tests/test_chapter_notebooks.py \
            -v --tb=short \
            -k "$FILTER"

  # ---------------------------------------------------------------------------
  # Case study pipeline tests — inside Docker (ml4t/ml4t:latest)
  # ---------------------------------------------------------------------------
  test-case-studies:
    name: cs-${{ matrix.case-study }}
    timeout-minutes: 90
    needs: [lint, changes]
    if: needs.changes.outputs.case_matrix != '[]'

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.case_matrix) }}

    runs-on: ubuntu-latest
    container:
      image: ml4t/ml4t:latest

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git git-lfs openssh-client >/dev/null

      - uses: actions/checkout@v6

      - name: Checkout test data
        uses: actions/checkout@v6
        with:
          repository: ml4t/third-edition-test-data
          path: test-data
          ssh-key: ${{ secrets.TEST_DATA_DEPLOY_KEY }}
          lfs: false

      - name: Seed case study intermediates
        run: |
          mkdir -p $ML4T_OUTPUT_DIR
          if [ -d test-data/intermediates ]; then
            cp -r test-data/intermediates/* $ML4T_OUTPUT_DIR/
            echo "Seeded $(du -sh $ML4T_OUTPUT_DIR | cut -f1) of intermediates"
          fi

      # ml4t/ml4t:latest only bakes in pytest + pytest-timeout (envs/ml4t/Dockerfile);
      # pytest-rerunfailures lives in the dev extra, which this image doesn't install.
      # Without it, overrides.yaml's `reruns:` key (tests/conftest.py) silently adds no
      # retry marker, so a notebook marked flaky just fails outright here.
      - name: Install pytest-rerunfailures
        run: pip install --no-cache-dir "pytest-rerunfailures>=15.0"

      - name: Run pipeline (${{ matrix.case-study }})
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_FILTER_INPUT: ${{ github.event.inputs.test_filter }}
          MATRIX_CASE_STUDY: ${{ matrix.case-study }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          FILTER="${TEST_FILTER_INPUT:-$MATRIX_CASE_STUDY}"
          python -m pytest tests/test_case_studies.py \
            -v --tb=short \
            -k "$FILTER"

  # ---------------------------------------------------------------------------
  # Py312 Docker image (Python 3.12: gensim, signatory, esig, tfcausalimpact,
  # plus notebooks affected by the Py3.14 torch CUDA bug)
  # ---------------------------------------------------------------------------
  test-py312:
    timeout-minutes: 45
    needs: [lint, changes]
    if: needs.changes.outputs.run_py312 == 'true'

    runs-on: ubuntu-latest
    container:
      image: ml4t/ml4t-py312:latest

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git git-lfs openssh-client >/dev/null

      - uses: actions/checkout@v6

      - name: Checkout test data
        uses: actions/checkout@v6
        with:
          repository: ml4t/third-edition-test-data
          path: test-data
          ssh-key: ${{ secrets.TEST_DATA_DEPLOY_KEY }}
          lfs: false

      - name: Run py312 notebooks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_docker_notebooks.py \
            -v --tb=short \
            -k "03_sigcwgan or 06_path_signatures or 12_wasserstein \
                or 01_word2vec or 02_asset_embeddings or 03_sentiment_evolution \
                or 01_timegan or 07_dp_gan \
                or 10_shap_nlp_sentiment or 06_conditional_autoencoder \
                or 06_fed_announcement_bsts"

  # ---------------------------------------------------------------------------
  # Neo4j Docker service (Ch23 Knowledge Graphs)
  # ---------------------------------------------------------------------------
  test-neo4j:
    timeout-minutes: 30
    needs: [lint, changes]
    if: needs.changes.outputs.run_neo4j == 'true'

    runs-on: ubuntu-latest
    container:
      image: ml4t/ml4t:latest
      env:
        NEO4J_URI: bolt://neo4j:7687
        NEO4J_USER: neo4j
        NEO4J_PASSWORD: password

    services:
      neo4j:
        image: neo4j:2026.02.2
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq git git-lfs openssh-client >/dev/null

      - uses: actions/checkout@v6

      - name: Checkout test data
        uses: actions/checkout@v6
        with:
          repository: ml4t/third-edition-test-data
          path: test-data
          ssh-key: ${{ secrets.TEST_DATA_DEPLOY_KEY }}
          lfs: false

      - name: Run Ch23 Knowledge Graph notebooks (pipeline order)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Run in dependency order: upstream notebooks generate data for downstream
          python -m pytest tests/test_docker_notebooks.py -v --tb=short \
            -k "08_8k_event_extraction" && \
          python -m pytest tests/test_docker_notebooks.py -v --tb=short \
            -k "02_supply_chain_kg_construction" && \
          python -m pytest tests/test_docker_notebooks.py -v --tb=short \
            -k "07_dynamic_kg_temporal or 03_graph_rag_qa or 05_institutional_holdings_kg \
                or 09_knowledge_graph_features"

  # ---------------------------------------------------------------------------
  # Benchmark Docker image (Ch02 storage benchmarks + database services)
  # ---------------------------------------------------------------------------
  test-benchmark:
    timeout-minutes: 30
    needs: [lint, changes]
    if: needs.changes.outputs.run_benchmark == 'true'

    runs-on: ubuntu-latest
    container:
      image: ml4t/ml4t-benchmark:latest
      env:
        CLICKHOUSE_HOST: clickhouse
        CLICKHOUSE_PORT: "8123"
        QUESTDB_HOST: questdb
        QUESTDB_HTTP_PORT: "9000"
        TIMESCALE_HOST: timescaledb
        TIMESCALE_PORT: "5432"
        TIMESCALE_PASSWORD: benchmark
        INFLUXDB_HOST: influxdb
        INFLUXDB_PORT: "8086"
        INFLUXDB_ORG: ml4t
        INFLUXDB_TOKEN: benchmark-token
        INFLUXDB_BUCKET: market_data

    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: ml4t
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      clickhouse:
        image: clickhouse/clickhouse-server:latest
        env:
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      questdb:
        image: questdb/questdb:latest
        env:
          QDB_METRICS_ENABLED: "true"
        options: >-
          --health-cmd "curl -sf http://localhost:9003/status || curl -sf http://localhost:9000/exec?query=SELECT%201"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10

      influxdb:
        image: influxdb:2.7
        env:
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: admin
          DOCKER_INFLUXDB_INIT_PASSWORD: benchmark123
          DOCKER_INFLUXDB_INIT_ORG: ml4t
          DOCKER_INFLUXDB_INIT_BUCKET: market_data
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: benchmark-token
        options: >-
          --health-cmd "curl -f http://localhost:8086/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install git
        run: |
          apt-get update -qq && apt-get install -y -qq git git-lfs openssh-client >/dev/null 2>&1 || true

      - uses: actions/checkout@v6

      - name: Checkout test data
        uses: actions/checkout@v6
        with:
          repository: ml4t/third-edition-test-data
          path: test-data
          ssh-key: ${{ secrets.TEST_DATA_DEPLOY_KEY }}
          lfs: false

      - name: Run Ch02 database benchmark notebooks
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/test_docker_notebooks.py \
            -v --tb=short \
            -k "18_storage_benchmark_database or 20_storage_benchmark_database"
