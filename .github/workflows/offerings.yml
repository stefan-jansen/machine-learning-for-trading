# Keep the README's courses, workshops, and free lessons current.
#
# Dates in a README go stale silently. The July 30, 2026 reader's guide sat at
# the top of this file for four weeks after it ran and readers kept signing up
# for it. So the offerings block is generated, not written: this job reads the
# public Maven profile every morning, drops what is past, and opens a pull
# request when the rendered block no longer matches the file.
#
# It never pushes to main. `main` is protected, so the job's whole output is one
# reusable pull request on the `chore/offerings` branch, force-updated in place
# so a run never leaves a pile of them behind, with auto-merge armed on it. The
# required checks are the gate; nobody watches this job.
#
# **It needs `OFFERINGS_TOKEN`.** Required status checks do not fire on a pull
# request opened with the default GITHUB_TOKEN, so with GITHUB_TOKEN the PR opens
# in `action_required` and auto-merge can never resolve. `OFFERINGS_TOKEN` is a
# fine-grained PAT with contents:write and pull-requests:write; the job fails
# loudly when it is missing rather than leaving a PR nobody can land.

name: README Offerings

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-offerings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Require the token that lets the checks fire
        run: |
          if [ -z "${{ secrets.OFFERINGS_TOKEN }}" ]; then
            echo "::error::OFFERINGS_TOKEN is not set. With the default GITHUB_TOKEN the"\
                 "required checks never run, so the pull request opens in action_required"\
                 "and auto-merge cannot resolve it. Create a fine-grained PAT with"\
                 "contents:write and pull-requests:write and add it as the OFFERINGS_TOKEN"\
                 "repository secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # actions/checkout persists whichever token it is given as the git
          # credential, and `git push` uses that one, not GH_TOKEN. Without this
          # the push always runs as the default token and the required checks
          # never fire on the pull request.
          token: ${{ secrets.OFFERINGS_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render the offerings block
        run: python .github/scripts/update_offerings.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.OFFERINGS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README offerings are current; nothing to do."
            exit 0
          fi

          git config user.name  "ml4t-offerings[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/offerings
          git add README.md
          git commit -m "Refresh the README offerings block from the Maven schedule"
          git push --force origin chore/offerings

          number="$(gh pr list --head chore/offerings --state open --json number --jq '.[].number')"
          if [ -z "$number" ]; then
            gh pr create \
              --base main \
              --head chore/offerings \
              --title "Refresh the README offerings block" \
              --body "$(printf '%s\n' \
                'The courses, workshops, and free lessons in the README no longer match the' \
                'live Maven schedule at https://maven.com/stefan-jansen.' \
                '' \
                'Generated by `.github/scripts/update_offerings.py`, run daily by' \
                '`.github/workflows/offerings.yml`. Only the regions between the' \
                '`offerings:next` and `offerings:all` markers change.' \
                '' \
                'Auto-merge is armed: the required checks are the gate and no one needs to' \
                'watch this. The rendered block is generated from the live schedule, so a' \
                'wrong date here is a bug in `update_offerings.py`, not a review miss.' \
                '' \
                'Generated by GitHub Actions.')"
            # `gh pr create` prints the PR URL, not JSON, and takes no --jq. Read the
            # number back from the API rather than parsing that line.
            number="$(gh pr list --head chore/offerings --state open --json number --jq '.[].number')"
          else
            echo "Existing pull request updated in place."
          fi

          # The required checks are the gate. Arming auto-merge is what makes this
          # job end-to-end unattended; without it every date change waits on a human.
          gh pr merge "$number" --auto --squash --delete-branch
