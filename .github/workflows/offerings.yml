# Keep the README's courses, workshops, and free lessons current.
#
# Dates in a README go stale silently. The July 30, 2026 reader's guide sat at
# the top of this file for four weeks after it ran and readers kept signing up
# for it. So the offerings block is generated, not written: this job reads the
# public Maven profile every morning, drops what is past, and opens a pull
# request when the rendered block no longer matches the file.
#
# It never pushes to main. `main` is protected and marketing copy gets read by a
# person before it ships, so the job's whole output is one reusable pull request
# on the `chore/offerings` branch, force-updated in place so a run never leaves a
# pile of them behind.
#
# Required status checks do not run on a pull request opened with the default
# GITHUB_TOKEN. Set an `OFFERINGS_TOKEN` repository secret (a fine-grained PAT
# with contents:write and pull-requests:write) and they will; without one the
# PR still opens and needs a manual re-trigger before it can merge.

name: README Offerings

on:
  schedule:
    - cron: '0 7 * * *'   # daily 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-offerings
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # actions/checkout persists whichever token it is given as the git
          # credential, and `git push` uses that one, not GH_TOKEN. Without this
          # the push always runs as the default token and the required checks
          # never fire on the pull request.
          token: ${{ secrets.OFFERINGS_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Render the offerings block
        run: python .github/scripts/update_offerings.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.OFFERINGS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README offerings are current; nothing to do."
            exit 0
          fi

          git config user.name  "ml4t-offerings[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/offerings
          git add README.md
          git commit -m "Refresh the README offerings block from the Maven schedule"
          git push --force origin chore/offerings

          if [ -z "$(gh pr list --head chore/offerings --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head chore/offerings \
              --title "Refresh the README offerings block" \
              --body "$(printf '%s\n' \
                'The courses, workshops, and free lessons in the README no longer match the' \
                'live Maven schedule at https://maven.com/stefan-jansen.' \
                '' \
                'Generated by `.github/scripts/update_offerings.py`, run daily by' \
                '`.github/workflows/offerings.yml`. Only the regions between the' \
                '`offerings:next` and `offerings:all` markers change.' \
                '' \
                'Read the rendered block before merging: it is the copy readers see.')"
          else
            echo "Existing pull request updated in place."
          fi
