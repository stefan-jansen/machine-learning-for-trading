# Does OFFERINGS_TOKEN carry pull-requests:write?
#
# The daily README Offerings job failed from 2026-09-16 with
#
#     GraphQL: Resource not accessible by personal access token (createPullRequest)
#
# and its own success does not answer the question: the pull request step opens
# with `git diff --quiet -- README.md` and exits early whenever the rendered
# block is current, so a green run can mean the call was never made. On
# 2026-09-19 that is exactly what happened.
#
# This workflow asks the token directly, through the same GraphQL mutation that
# `gh pr create` uses, so it tests the surface that actually failed rather than
# the REST endpoint beside it. `headRefName` and `baseRefName` are both `main`,
# which GitHub refuses as UNPROCESSABLE, so nothing is ever created:
#
#     "Resource not accessible by personal access token"  the scope is missing
#     "No commits between main and main"                  the scope is present;
#         the mutation was authorized and then rejected on the empty range
#
# Dispatch-only, no checkout, no write of any kind. The full response is printed
# so the verdict can be read rather than taken on faith.
#
# workflow_dispatch only fires for a workflow file on the default branch, so
# this has to land on `main` before it can be run, and deleting it afterwards is
# a second commit there.
name: OFFERINGS_TOKEN probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the token whether it can open a pull request
        env:
          GH_TOKEN: ${{ secrets.OFFERINGS_TOKEN }}
        run: |
          # Actions runs a `run:` block as `bash --noprofile --norc -eo pipefail {0}`,
          # so -e is already on and `set -uo pipefail` does not clear it. Every
          # answer this step wants to read is a non-zero exit - `gh api graphql`
          # returns 1 whenever the response carries a GraphQL error, and the
          # authorized answer IS a GraphQL error - so -e has to come off or the
          # step dies before the verdict.
          set +e
          set -u
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "OFFERINGS_TOKEN is not set on this repository" >&2
            exit 1
          fi

          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY##*/}

          repo_id=$(gh api graphql \
                      -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){id}}' \
                      -F o="$owner" -F n="$name" --jq .data.repository.id 2>&1)
          # `A || B && C` binds as `(A || B) && C` in sh, so the shape test is one
          # pattern match rather than a chain: a node id is a bare base64-ish token,
          # and any error gh prints instead contains a space or a brace.
          if ! printf '%s' "$repo_id" | grep -qE '^[A-Za-z0-9_=+/-]+$'; then
            echo "could not read the repository id, so the token cannot even read this repo:" >&2
            printf '%s\n' "$repo_id" >&2
            exit 1
          fi

          response=$(gh api graphql -f query='
            mutation($r:ID!){
              createPullRequest(input:{
                repositoryId:$r, baseRefName:"main", headRefName:"main", title:"scope probe"
              }){ pullRequest { number } }
            }' -F r="$repo_id" 2>&1)

          echo "--- raw response ---"
          printf '%s\n' "$response"
          echo "--- end raw response ---"

          if printf '%s' "$response" | grep -q "Resource not accessible by personal access token"; then
            echo "FAIL: the token still lacks pull-requests:write." >&2
            exit 1
          fi
          if printf '%s' "$response" | grep -q "No commits between main and main"; then
            echo "PASS: the mutation was authorized and refused on the empty range."
            echo "OFFERINGS_TOKEN holds pull-requests:write."
            exit 0
          fi
          if printf '%s' "$response" | grep -qE '"number":[0-9]+'; then
            echo "UNEXPECTED: a pull request was created. Close it." >&2
            exit 1
          fi
          echo "INCONCLUSIVE: neither signature matched. Read the raw response above." >&2
          exit 1
