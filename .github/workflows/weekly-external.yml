# ML4T 3rd Edition — Weekly External Workflow (Tier 2)
#
# Runs notebooks tagged `tier: weekly` in tests/overrides.yaml — these have
# external dependencies (IB Gateway, OKX, chromadb, real LLM APIs, real HTTP)
# that aren't available in the per-commit Tier 1 workflow.
#
# Routing: ML4T_TEST_TIER=weekly env var → conftest tier-skip allows weekly NBs
# to run (per-commit run skips them automatically with the inverse rule).
#
# Today most still skip via existing `skip: true` because the underlying
# infrastructure (IB Gateway, OKX, etc.) isn't provisioned yet. The job's
# purpose is to exercise the routing/flake-retry/issue-opening plumbing so
# that when fixtures land (Steps 4-9 of the test-infra coverage plan) the
# weekly job auto-picks them up with no workflow change.
#
# Failure handling: each job classifies its JUnit report with
# .github/scripts/junit_outcomes.py and then files, reopens and CLOSES one issue
# per failing notebook or source, keyed on the id in the title. A notebook that
# passes closes its issue, so an open `weekly-flake` issue always means a
# standing failure rather than a fixed one nobody retired. A skip is not a pass
# and closes nothing. pytest-rerunfailures retries flaky NBs per-NB based on
# `reruns: N` in overrides.yaml.

name: Weekly External

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional pytest -k filter to narrow scope"
        type: string
        default: ""

env:
  ML4T_TEST_TIER: weekly
  ML4T_DATA_PATH: ${{ github.workspace }}/test-data/data
  ML4T_OUTPUT_DIR: /tmp/ml4t-test-output
  MPLBACKEND: Agg
  PLOTLY_RENDERER: json

jobs:
  weekly-chapters:
    name: weekly-chapters
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ml4t/ml4t:latest
    permissions:
      contents: read
      issues: write
    env:
      # Under the job container `~` is /root, which actions/cache can save but
      # which nothing else in this file names. A path under the bind-mounted
      # workspace is the one both the container and the cache action agree on.
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - name: Install git
        run: |
          # A transient apt mirror failure used to kill the whole job.
          for attempt in 1 2 3; do
            apt-get update -qq && apt-get install -y -qq git git-lfs openssh-client >/dev/null && exit 0
            echo "apt-get failed (attempt $attempt of 3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::apt-get could not install git after three attempts"
          exit 1

      - uses: actions/checkout@v6

      - name: Checkout test data
        uses: actions/checkout@v6
        with:
          repository: ml4t/third-edition-test-data
          ref: ci
          path: test-data
          ssh-key: ${{ secrets.TEST_DATA_DEPLOY_KEY }}
          lfs: false

      # Chapter 22 pulls its embedding checkpoints at run time, and this job set no
      # HF_HOME and cached nothing, so every Monday re-downloaded them inside a fresh
      # container. 02_domain_embeddings_comparison is the only weekly notebook that
      # pulls a large one - BAAI/bge-large-en-v1.5, about 1.3 GB - and it is the only
      # weekly notebook that fails: in run 37320316180 it raised "couldn't connect to
      # huggingface.co" at cell 27 while 03_hybrid_retrieval (31 s) and
      # 05_10k_rag_assistant (48 s) pulled their ~90 MB models and passed in the same
      # job. That is a throttled shared-IP runner losing a long transfer, not an
      # unreachable host, which is why passing HF_TOKEN on 2026-09-12 did not help.
      #
      # Budget, measured 2026-10-09: the repository holds 2.47 GB across 7 caches
      # against a 10 GB limit, the largest being hf-ch11-12 at 0.76 GB per week. The
      # weekly checkpoints are ~1.6 GB and `restore-keys` keeps at most two weekly
      # buckets live, so this lands the repository near 5.7 GB worst case. Re-measure
      # with `gh api .../actions/cache/usage` rather than trusting this number; over
      # the limit GitHub evicts least-recently-used and the eviction is silent.
      #
      # The key buckets by ISO week for the same reason test.yml's does: the model ids
      # are literals inside the notebooks, so nothing in the repo declares what to pin,
      # and a weekly bucket picks up a newly added checkpoint at the cost of one
      # download instead of freezing the cache forever.
      - name: HuggingFace cache key
        id: hfkey
        run: echo "week=$(date -u +%GW%V)" >> "$GITHUB_OUTPUT"

      - name: Cache HuggingFace checkpoints
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-weekly-${{ steps.hfkey.outputs.week }}
          restore-keys: |
            hf-weekly-

      - name: Record the fixture this job read
        run: |
          # tee, not a plain redirect: the summary is where a reader looks, and the log is
          # where this is greppable and where a broken command would be visible at all. A
          # step whose whole output goes somewhere no API exposes cannot be checked.
          printf '%s\n' "test-data $(git -C test-data rev-parse HEAD)" \
            "$(git -C test-data log -1 --format='%cs %s')" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Seed case study intermediates
        run: |
          mkdir -p "$ML4T_OUTPUT_DIR"
          if [ -d test-data/intermediates ]; then
            cp -r test-data/intermediates/* "$ML4T_OUTPUT_DIR"/
          fi

      - name: Run weekly chapter notebooks
        id: pytest_chapters
        env:
          PYTHONPATH: ${{ github.workspace }}
          TEST_FILTER_INPUT: ${{ github.event.inputs.test_filter }}
          # NO-SPEND POLICY: only FREE providers are wired here. Billed APIs
          # (OpenAI, OKX authenticated, Databento) are intentionally NOT passed,
          # so any notebook needing them skips rather than incurs a charge.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
          # A HuggingFace token is free and buys a per-account rate limit instead of
          # the per-IP one a shared runner pool exhausts, so it is inside the policy
          # above. test.yml started passing it on 2026-09-12 and this workflow was
          # missed; 22_rag_financial_research/02_domain_embeddings_comparison then
          # failed here on 2026-09-14 with "couldn't connect to huggingface.co",
          # which is what transformers raises for a 429 as well as for a real network
          # failure. An unset secret leaves downloads anonymous, which is the state
          # this job was already in, so the change cannot make it worse.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set +e
          # Build -k via positional params so a multi-word filter (e.g.
          # "foo or bar") stays a single pytest argument instead of being
          # word-split. POSIX sh has no arrays and this container's default
          # shell is dash, so "$@" is the portable stand-in for an array.
          set --
          if [ -n "${TEST_FILTER_INPUT:-}" ]; then
            set -- -k "${TEST_FILTER_INPUT}"
          fi
          # Public repo: chapter notebooks only. Case-study pipeline tests need
          # gated results/registries that aren't shipped, so they're excluded.
          python -m pytest tests/test_chapter_notebooks.py \
            -v --tb=short -m weekly "$@" \
            --junitxml=junit-weekly.xml
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-weekly
          path: junit-weekly.xml
          retention-days: 30

      - name: Classify the outcomes
        id: outcomes
        if: always()
        run: |
          # One parser, in a script with tests, rather than a regex in this file
          # twice. Those regexes read the `name="` inside `classname="`, so every
          # weekly failure was filed under the test class and no issue ever named
          # the notebook that failed; #1046 absorbed all of them. The script also
          # reports what PASSED, which is what lets a filed issue close itself.
          echo "json=$(python .github/scripts/junit_outcomes.py junit-weekly.xml --id-style notebook)" \
            >> "$GITHUB_OUTPUT"

      - name: File, reopen and close `weekly-flake` issues
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOMES: ${{ steps.outcomes.outputs.json }}
          TITLE_PREFIX: weekly-flake
          BODY_INTRO: >-
            The weekly external workflow failed to execute this notebook.
        with:
          script: |
            const { failed, passed } = JSON.parse(process.env.OUTCOMES);
            const prefix = process.env.TITLE_PREFIX;
            const { owner, repo } = context.repo;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Listing beats searching. The search index lags by up to a minute,
            // so an issue this job just created can come back absent and be
            // created a second time. Closed issues are listed too, because a
            // notebook that flaps belongs in one thread that reopens rather than
            // in a new issue every Monday. listForRepo returns pull requests as
            // well, so they are dropped here rather than matched on by title.
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: prefix, per_page: 100,
            });
            const byTitle = new Map();
            for (const issue of all) {
              if (issue.pull_request) continue;
              const held = byTitle.get(issue.title);
              // An open issue wins over a closed one with the same title, and the
              // newest of two open ones wins, so a historical duplicate cannot
              // make this comment on a thread nobody is reading.
              if (!held
                  || (held.state === 'closed' && issue.state === 'open')
                  || (held.state === issue.state && issue.number > held.number)) {
                byTitle.set(issue.title, issue);
              }
            }

            for (const id of failed) {
              const title = `${prefix}: ${id}`;
              const existing = byTitle.get(title);
              if (!existing) {
                const { data } = await github.rest.issues.create({
                  owner, repo, title,
                  body: `${process.env.BODY_INTRO}\n\n` +
                        `\`${id}\`\n\nRun: ${runUrl}\n\n` +
                        `This issue is opened, commented and closed by the weekly ` +
                        `workflow. It closes on the first run in which this passes, ` +
                        `so an open one means a standing failure.`,
                  labels: [prefix],
                });
                core.info(`opened #${data.number} for ${id}`);
                continue;
              }
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: existing.state === 'closed'
                  ? `Failed again after closing: ${runUrl}`
                  : `Failed again in the weekly run: ${runUrl}`,
              });
              core.info(`updated #${existing.number} for ${id}`);
            }

            for (const id of passed) {
              const existing = byTitle.get(`${prefix}: ${id}`);
              if (!existing || existing.state !== 'open') continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Passed in the weekly run: ${runUrl}. Closing; it reopens ` +
                      `if this fails again.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`closed #${existing.number} for ${id}`);
            }

      - name: Fail job if pytest failed
        if: steps.pytest_chapters.outputs.exit_code != '0'
        run: |
          echo "Weekly pytest exited with code ${{ steps.pytest_chapters.outputs.exit_code }}"
          exit 1

  # ---------------------------------------------------------------------------
  # Phase 3 — live external drift smoke.
  #
  # One tiny REAL pull per free data source (tests/test_external_drift.py, marked
  # `drift`). Catches upstream provider/schema drift: when a source moves,
  # renames a file, or changes its payload shape, the matching test fails and we
  # file a deduped issue. No billed APIs — key-gated sources (FRED, OANDA) skip
  # when their free key is absent; geo-restricted sources (Kalshi/Polymarket)
  # skip when blocked. Flake-tolerant via pytest-rerunfailures when available.
  # ---------------------------------------------------------------------------
  weekly-drift:
    name: weekly-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ml4t/ml4t:latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Install git
        run: |
          # A transient apt mirror failure used to kill the whole job.
          for attempt in 1 2 3; do
            apt-get update -qq && apt-get install -y -qq git >/dev/null && exit 0
            echo "apt-get failed (attempt $attempt of 3); retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "::error::apt-get could not install git after three attempts"
          exit 1

      - uses: actions/checkout@v6

      - name: Run external drift smoke
        id: pytest_drift
        env:
          PYTHONPATH: ${{ github.workspace }}
          # NO-SPEND POLICY: only FREE keys. Billed APIs stay unset → their
          # drift tests skip rather than charge.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EDGAR_IDENTITY: ${{ secrets.EDGAR_IDENTITY }}
        run: |
          set +e
          # utils.config requires a .env file to exist; create a minimal one and
          # point the data path at the repo's own data/ dir (no test-data here).
          printf 'ML4T_PATH=%s\nML4T_DATA_PATH=%s/data\n' \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" > .env
          # Flake tolerance only if pytest-rerunfailures is installed in the image.
          RERUN_ARGS=""
          if python -c "import pytest_rerunfailures" 2>/dev/null; then
            RERUN_ARGS="--reruns 2 --reruns-delay 30"
          fi
          # RERUN_ARGS holds two flags and their values and has to split into four
          # words. Quoting it passes "--reruns 2 --reruns-delay 30" as one argument,
          # which pytest rejects, so the unquoted expansion is the point.
          # shellcheck disable=SC2086
          python -m pytest tests/test_external_drift.py -m drift \
            -v --tb=short $RERUN_ARGS \
            --junitxml=junit-drift.xml
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-drift
          path: junit-drift.xml
          retention-days: 30

      - name: Classify the outcomes
        id: outcomes
        if: always()
        run: |
          # One parser, in a script with tests, rather than a regex in this file
          # twice. Those regexes read the `name="` inside `classname="`, so every
          # weekly failure was filed under the test class and no issue ever named
          # the notebook that failed; #1046 absorbed all of them. The script also
          # reports what PASSED, which is what lets a filed issue close itself.
          echo "json=$(python .github/scripts/junit_outcomes.py junit-drift.xml --id-style drift)" \
            >> "$GITHUB_OUTPUT"

      - name: File, reopen and close `external-drift` issues
        if: always()
        uses: actions/github-script@v7
        env:
          OUTCOMES: ${{ steps.outcomes.outputs.json }}
          TITLE_PREFIX: external-drift
          BODY_INTRO: >-
            The weekly external drift smoke failed for this source: an
            upstream free data provider appears to have moved, renamed a file,
            or changed its payload schema.
        with:
          script: |
            const { failed, passed } = JSON.parse(process.env.OUTCOMES);
            const prefix = process.env.TITLE_PREFIX;
            const { owner, repo } = context.repo;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            // Listing beats searching. The search index lags by up to a minute,
            // so an issue this job just created can come back absent and be
            // created a second time. Closed issues are listed too, because a
            // notebook that flaps belongs in one thread that reopens rather than
            // in a new issue every Monday. listForRepo returns pull requests as
            // well, so they are dropped here rather than matched on by title.
            const all = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: prefix, per_page: 100,
            });
            const byTitle = new Map();
            for (const issue of all) {
              if (issue.pull_request) continue;
              const held = byTitle.get(issue.title);
              // An open issue wins over a closed one with the same title, and the
              // newest of two open ones wins, so a historical duplicate cannot
              // make this comment on a thread nobody is reading.
              if (!held
                  || (held.state === 'closed' && issue.state === 'open')
                  || (held.state === issue.state && issue.number > held.number)) {
                byTitle.set(issue.title, issue);
              }
            }

            for (const id of failed) {
              const title = `${prefix}: ${id}`;
              const existing = byTitle.get(title);
              if (!existing) {
                const { data } = await github.rest.issues.create({
                  owner, repo, title,
                  body: `${process.env.BODY_INTRO}\n\n` +
                        `\`${id}\`\n\nRun: ${runUrl}\n\n` +
                        `This issue is opened, commented and closed by the weekly ` +
                        `workflow. It closes on the first run in which this passes, ` +
                        `so an open one means a standing failure.`,
                  labels: [prefix],
                });
                core.info(`opened #${data.number} for ${id}`);
                continue;
              }
              if (existing.state === 'closed') {
                await github.rest.issues.update({
                  owner, repo, issue_number: existing.number, state: 'open',
                });
              }
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: existing.state === 'closed'
                  ? `Failed again after closing: ${runUrl}`
                  : `Failed again in the weekly run: ${runUrl}`,
              });
              core.info(`updated #${existing.number} for ${id}`);
            }

            for (const id of passed) {
              const existing = byTitle.get(`${prefix}: ${id}`);
              if (!existing || existing.state !== 'open') continue;
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Passed in the weekly run: ${runUrl}. Closing; it reopens ` +
                      `if this fails again.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number,
                state: 'closed', state_reason: 'completed',
              });
              core.info(`closed #${existing.number} for ${id}`);
            }

      - name: Fail job if drift smoke failed
        if: steps.pytest_drift.outputs.exit_code != '0'
        run: |
          echo "Drift smoke exited with code ${{ steps.pytest_drift.outputs.exit_code }}"
          exit 1
