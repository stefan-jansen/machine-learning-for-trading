# Posts what `PR triage` found.
#
# Split from the job that reads the diff so that no step with a writable token
# ever runs in a workspace holding a fork's code. This job checks out nothing: it
# downloads the artifact the first workflow produced and posts it.

name: PR triage comment

on:
  workflow_run:
    workflows: ["PR triage"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    name: comment
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Download the findings
        uses: actions/download-artifact@v4
        with:
          name: pr-triage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update the comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const findings = JSON.parse(fs.readFileSync('triage.json', 'utf8'));
            const body = fs.readFileSync('triage.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = findings.pr;

            // One comment, edited in place: a bot that appends on every push is
            // noise a reader learns to scroll past.
            const marker = '<!-- pr-triage -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const mine = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );
            if (mine) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
