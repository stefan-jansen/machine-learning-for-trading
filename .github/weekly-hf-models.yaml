# The HuggingFace checkpoints the weekly notebooks download, and the revision each
# notebook pins. The weekly job prefetches exactly these into its cache, and the
# cache key is a digest of this file.
#
# Keying on the pins rather than on a date is the point. A weekly bucket would throw
# ~1.6 GB away every Monday and re-download it, which is the cost the cache exists to
# remove; this invalidates when a pin changes and at no other time. A new or changed
# pin in a notebook makes tests/test_weekly_hf_manifest.py fail, so this cannot go
# stale quietly.
#
# `revision` is the notebook's own pin, read off the source. Do not edit one here
# without editing the notebook: the test compares the two.
models:
  - repo_id: BAAI/bge-large-en-v1.5
    revision: d4aa6901d3a41ba39fb536a557fa166f842b0e09
    # ~1.3 GB, and the only large one. This is the download that failed every weekly
    # run while the job cached nothing.
    notebooks:
      - 22_rag_financial_research/02_domain_embeddings_comparison
  - repo_id: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    notebooks:
      - 22_rag_financial_research/02_domain_embeddings_comparison
      - 22_rag_financial_research/03_hybrid_retrieval
  - repo_id: cross-encoder/ms-marco-MiniLM-L-6-v2
    revision: c5ee24cb16019beea0893ab7796b1df96625c6b8
    notebooks:
      - 22_rag_financial_research/03_hybrid_retrieval
  - repo_id: BAAI/bge-small-en-v1.5
    revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
    notebooks:
      - 22_rag_financial_research/05_10k_rag_assistant
