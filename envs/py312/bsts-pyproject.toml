[project]
name = "ml4t-bsts"
version = "3.0.0"
description = "Isolated TensorFlow Probability BSTS runtime for Chapter 15"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.0",
    "polars>=1.38,<2.0",
    # pyarrow 26.0.0 raises ImportError("pyarrow requires NumPy 2.0 or newer") on
    # import. numpy cannot move here: tfcausalimpact needs pandas<=2.2, and 2.2.0 is
    # a numpy-1 build, so this environment is pinned to numpy 1.26.4 and the pyarrow
    # it loads has to be one that still runs on the numpy 1.x ABI. 25.0.0 imports;
    # 26.0.0 is the first that does not.
    "pyarrow>=15.0,<26",
    "matplotlib>=3.8",
    "plotly>=5.20,<7",
    "tfcausalimpact==0.0.18",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jupytext>=1.16",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "papermill>=2.6",
    "pytest>=9.0",
    "pytest-timeout>=2.3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"
