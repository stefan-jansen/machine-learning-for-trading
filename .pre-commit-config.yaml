# Pre-commit hooks for ML4T Technical Review
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
        exclude: \.ipynb$
      - id: ruff-format
        types: [python]
        exclude: \.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      # Compile-time syntax check. ast.parse misses errors raised only at
      # compile time (duplicate kwargs, await outside async, return at module
      # level, etc.) — `python -m py_compile` invokes the full compile()
      # path and catches them. Cheap; runs on every staged Python file.
      - id: py-compile
        name: python -m py_compile (catches duplicate kwargs etc.)
        language: system
        entry: python3 -m py_compile
        types: [python]
        exclude: \.ipynb$

      # Load gate: a paired .ipynb must agree with its .py, or JupyterLab's
      # jupytext contents manager refuses to open it and the reader gets a
      # "File Load Error" instead of a notebook (public issue #372 — papermill
      # leaves an empty `tags: []` on every cell that the .py does not carry).
      # Only checks the staged pairs. See .github/scripts/check_notebook_pair_sync.py.
      - id: notebook-pair-sync
        name: notebook/py pair opens in JupyterLab
        language: system
        entry: python3 .github/scripts/check_notebook_pair_sync.py
        files: \.(ipynb|py)$

      # The provenance sync gate — a stamped notebook must be its CURRENT .py
      # executed in a production run — deliberately does NOT run here. It ran on
      # every commit over every notebook in the repo, so one stale notebook
      # anywhere blocked every commit by every agent, including commits that
      # touched no notebook. That stops work being checkpointed, which is how
      # work gets lost. It gates the merge instead: the `guards` job in
      # .github/workflows/test.yml runs
      #   notebook_provenance.py check --since <base>
      # on the pull request, over the notebooks that pull request changes. Run it
      # locally against your branch whenever you want the same answer early.
