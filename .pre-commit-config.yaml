# Pre-commit hooks for ML4T Technical Review
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Keep in lockstep with the `ruff==` pin in pyproject.toml's dev extra;
  # tests/test_toolchain_pins.py fails when the two drift.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]
        exclude: \.ipynb$
      - id: ruff-format
        types: [python]
        exclude: \.ipynb$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      # Compile-time syntax check. ast.parse misses errors raised only at
      # compile time (duplicate kwargs, await outside async, return at module
      # level, etc.) — `python -m py_compile` invokes the full compile()
      # path and catches them. Cheap; runs on every staged Python file.
      - id: py-compile
        name: python -m py_compile (catches duplicate kwargs etc.)
        language: system
        entry: python3 -m py_compile
        types: [python]
        exclude: \.ipynb$

      # Load gate: a paired .ipynb must agree with its .py, or JupyterLab's
      # jupytext contents manager refuses to open it and the reader gets a
      # "File Load Error" instead of a notebook (public issue #372 — papermill
      # leaves an empty `tags: []` on every cell that the .py does not carry).
      # Only checks the staged pairs. See .github/scripts/check_notebook_pair_sync.py.
      - id: notebook-pair-sync
        name: notebook/py pair opens in JupyterLab
        language: system
        entry: python3 .github/scripts/check_notebook_pair_sync.py
        files: \.(ipynb|py)$

      # Sync gate: a stamped notebook must be its CURRENT .py executed in a
      # production run. Fails if any provenance-stamped .ipynb is stale (its
      # paired .py changed since execution) or was committed from a TEST-mode
      # run. Unstamped notebooks are advisory only (gradual adoption). See
      # .github/scripts/notebook_provenance.py.
      # Scoped to the staged files since 2026-08-22. It used to scan the whole tree
      # on every commit, so one notebook another session had left dirty blocked every
      # unrelated commit in that worktree - three worktrees were stuck that way in a
      # single day, and the cme_futures one could not commit anything for six days.
      # Nothing unstaged can reach main, so the narrower scan gives up no protection,
      # and CI still calls `check` with no arguments and scans everything.
      - id: notebook-sync
        name: notebook provenance sync gate
        language: system
        entry: python3 .github/scripts/notebook_provenance.py check
        files: \.(py|ipynb)$
        pass_filenames: true

      # Verification gate: a notebook whose verifier signed off on one exact
      # version may not be silently changed. `.verified-notebooks.tsv` records
      # the .py blob at sign-off; this fails a commit that changes a listed .py
      # while leaving its row intact. Four batch rewrites in the week to
      # 2026-08-06 erased ~30 verifications this way, PR #478 doing 34 notebooks
      # in one commit. See .github/scripts/check_verified_notebooks.py.
      - id: verified-notebooks
        name: verified notebook not silently changed
        language: system
        entry: python3 .github/scripts/check_verified_notebooks.py
        pass_filenames: false
        always_run: true

      # OpenMP gate: scikit-learn, LightGBM, XGBoost, CatBoost and torch each
      # ship an OpenMP runtime and the first one loaded wins for the process.
      # A reader on macOS ARM64 who gets scikit-learn's first loses the kernel
      # to a segfault on the next multithreaded LightGBM fit — no traceback
      # (R2P issues #7 and #10). No Linux runner reproduces it, so CI never saw
      # it, and "organize imports" silently reintroduces it. Runs repo-wide
      # because the order can also be broken from a module the commit does not
      # touch. See .github/scripts/check_openmp_import_order.py.
      - id: openmp-import-order
        name: GBM imported before scikit-learn
        language: system
        entry: python3 .github/scripts/check_openmp_import_order.py
        pass_filenames: false
        always_run: true
