# The smoke configuration for every stage-06-and-later case-study notebook.
#
# A smoke run executes the whole notebook on a reduced problem, into a throwaway workspace, and
# registers real rows. It is what makes "the notebook works" a thing you can see before paying for
# a run that costs hours. Stefan set the standard on 2026-09-04, after a weekend disappeared into
# an eight-hour run nobody could tell was progressing.
#
# This file is the DECLARATION. The machinery it drives already exists and is not duplicated here:
#
#   scripts/nb-run.sh (agents repo)   executes one notebook under the slot semaphore, records its
#                                     elapsed time and peak memory in notebook-runtimes.tsv, and
#                                     routes a parameterized run to a scratch copy so the committed
#                                     notebook is untouched
#   scripts/nb-queue.sh (agents repo) dispatches a chain of them in stage order
#   open_study(execution_tier=...)    reads canonical features and labels in place, redirects every
#                                     write to the workspace
#
# `parameters` are passed to papermill exactly as written. Reading them back is what
# tests/test_smoke_configs.py does, so a value here that no longer reaches its notebook is a test
# failure rather than a run that quietly does something else.
#
# `measured_s` is the elapsed time of a real run, from notebook-runtimes.tsv. It is a record, not a
# budget: criteria 5 and 6 of the stage-06 spec ask for under five minutes each and a median under
# two, and a figure here above that is a notebook to reduce further, not a number to edit.
#
# `writes` names the registry tables the smoke run must land at least one row in. It deliberately
# omits `official_populations` and `official_population_members` for every entry: a preview run
# cannot create an official population, and it is
# `case_studies/research/population.py::_refuse_preview_activation` that stops it, on the grounds
# that a population is canonical by definition and a reduced run must not be able to publish one.
#
# `exempt` marks a notebook that cannot be run under the preview tier at all, with the reason. An
# exemption names the code that refuses, so it can be checked rather than believed.
#
# `blocked_by` marks something different, and the distinction is the point: a notebook that CAN
# meaningfully have a smoke run and does not have a working one today. Its configuration is
# declared and its defect has an issue. Filing it as exempt would retire the only signal saying
# so, and leaving it out of the file entirely would make the count look better than it is.

case_studies/cme_futures/04_model_based_features:
  parameters:
    MAX_PRODUCTS: 3
    REFIT_EVERY_OVERRIDE: 63
  # Stage 04 writes an artifact rather than registry rows, so there is no table to name here.
  # What it must produce is a model_based.parquet whose fitted columns carry values: the smoke
  # run above wrote 30,508 non-null ARIMA forecasts over 31,225 rows.
  writes: []
  measured_s: 54

case_studies/cme_futures/06_linear:
  parameters:
    EXECUTION_TIER: preview
    LABELS: ["fwd_ret_5d"]
    # Narrowing to one label makes this less than the declared catalog, and the notebook then
    # refuses to publish under the canonical population name. Giving the smoke run its own name
    # is the sanctioned way through; it is not a workaround.
    POPULATION_NAME: smoke-linear
    PREVIEW_REDUCTIONS: {folds: [0], max_symbols: 8, train_sample_frac: 0.5}
  writes: [training_runs, prediction_sets, prediction_metrics, prediction_coverage, fold_metrics]
  measured_s: 55

case_studies/cme_futures/07_gbm:
  parameters:
    EXECUTION_TIER: preview
    PREVIEW_REDUCTIONS: {folds: [0], max_symbols: 8, train_sample_frac: 0.5}
