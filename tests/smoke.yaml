case_studies/cme_futures/17_holdout_predictions:
  exempt: true
  exempt_reason: >-
    The holdout stage refits the selected configuration from its immutable canonical training
    spec, and research/models.py::reconstruct_locked_model_request refuses any spec whose
    execution_tier is not canonical. That refusal is the point of the stage: a holdout number
    computed under a reduced configuration would not be the holdout. Reached at cell 9 under
    EXECUTION_TIER=preview on 2026-09-05, after the earlier cells had been made to work.

case_studies/cme_futures/18_holdout_backtest:
  exempt: true
  exempt_reason: >-
    Reads the holdout prediction set 17_holdout_predictions produces, which for the same reason
    cannot exist in a preview workspace. Fails at cell 6 with "No holdout prediction set for
    training <hash>".

