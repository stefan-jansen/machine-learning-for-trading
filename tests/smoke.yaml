  measured_s: 52

case_studies/cme_futures/10_latent_factors:
  # An index notebook: it prints the declared latent-factor request population and launches
  # neither computation, so there is nothing to reduce and no registry row to check.
  parameters: {}
  writes: []
  measured_s: 14
  note: >-
    Running it through nb-run.sh with no parameters executes the COMMITTED notebook in place,
    because that is nb-run.sh's production path. A smoke run must not modify the repo, so this
    entry needs EXECUTION_TIER and WORKSPACE declared before it can be queued like the others.

