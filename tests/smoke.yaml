# --- nasdaq100_microstructure -------------------------------------------------------------------
#
# Primary label fwd_ret_15m. Intraday, so the reductions are symbol caps rather than row samples -
# a thinned intraday panel changes the decision cadence, which is what stopped crypto's backtest.

case_studies/nasdaq100_microstructure/06_linear:
  parameters:
    EXECUTION_TIER: preview
    LABELS: ["fwd_ret_15m"]
    POPULATION_NAME: smoke-linear
    PREVIEW_REDUCTIONS: {folds: [0], max_symbols: 5}
  writes: [training_runs, prediction_sets, prediction_metrics, prediction_coverage, fold_metrics]
  measured_s: 83
  # 6.6 GB measured on 2026-09-05T22:00Z, a five-symbol preview that exited 0 in 83 s. The full
  # 115-symbol sweep is entered at 60 GB, which is what a run inherits without this: above the
  # 40 GB line, so it takes every slot and waits for memory the reduced run never wanted. That
  # is not hypothetical - it happened twice earlier the same evening, for half an hour each.
  headroom_gb: 15

case_studies/nasdaq100_microstructure/07_gbm:
  parameters:
    EXECUTION_TIER: preview
    LABELS: ["fwd_ret_15m"]
    POPULATION_NAME: smoke-gbm
    # checkpoint_interval, not train_sample_frac. The fifteen fits cost about 40 s in total; the
    # rest of the run is predicting the intraday validation rows once per checkpoint, and at the
    # default interval of 50 over 500 trees that is 150 models. At 250 it is 30. Thinning rows
    # instead would attack the wrong half and change the panel this case study is about.
    PREVIEW_REDUCTIONS: {folds: [0], max_symbols: 5, checkpoint_interval: 250}
  writes: [training_runs, prediction_sets, prediction_metrics, prediction_coverage, fold_metrics]
  measured_s: 228
  # 8.2 GB measured on 2026-09-05T22:01Z, a five-symbol preview that exited 0. Its full sweep is
  # entered at 65 GB, and that entry is nb-run.sh's own weakest: no completed run backs it.
  headroom_gb: 15

