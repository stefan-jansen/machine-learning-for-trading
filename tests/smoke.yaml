    PREVIEW_LABELS: ["fwd_ret_5d"]
    # One, not six: shortlist_signal_configurations wants exactly this many DISTINCT
    # (family, config_name) pairs and raises when the pool holds fewer. A smoke chain that
    # backtests three predictions of one configuration has one. Asking for more here does not
    # produce more, it fails the run.
    PREVIEW_MAX_BASELINE_ROWS: 1
  writes: [backtest_runs, backtest_metrics]
  measured_s: 28

