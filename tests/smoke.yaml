case_studies/cme_futures/10b_stochastic_discount_factor:
  parameters:
    EXECUTION_TIER: preview
    PREVIEW_REDUCTIONS:
      {folds: [0], max_symbols: 5, n_epochs_cond: 1, n_epochs_moment: 1, n_epochs_unc: 1}
  writes: [training_runs, prediction_sets, prediction_metrics, prediction_coverage, fold_metrics]
  # At the floor of every reduction the family accepts - five symbols, one epoch per phase - and
  # still five minutes. SDF's cost is its three-phase structure rather than its panel, which is
  # the same finding GATES.tsv recorded on 2026-08-23 ("SDF is ~7x cae at equal reduction - phase
  # structure, not panel"). It cannot be brought under the budget by reducing it further.
  measured_s: 292

case_studies/cme_futures/11_causal_dml:
  parameters:
    EXECUTION_TIER: preview
    # n_placebo must clear MIN_PLACEBO_DRAWS (10) in utils/causal.py. Below it the permutation
    # test is not computed at all, refutation_p registers NULL, and the row is then REGISTERED
    # AND INCOMPLETE - which blocks its own re-run until someone deletes it. The recorded
    # reduction in work/2026-08-21-stocktake/.../preview-model-analysis.sh asks for 5 and hits
    # exactly that. All four fields are required: causal.py refuses a partial declaration.
    PREVIEW_REDUCTIONS: {max_samples: 20000, max_symbols: 12, n_folds: 2, n_placebo: 12}
  writes: [causal_runs]
  measured_s: 17

case_studies/cme_futures/12_model_analysis:
  parameters:
    EXECUTION_TIER: preview
  writes: []
  measured_s: 6

case_studies/cme_futures/13_backtest:
  parameters:
    EXECUTION_TIER: preview
    PREVIEW_LABELS: ["fwd_ret_5d"]
    PREVIEW_MAX_PREDICTIONS: 3
  writes: [backtest_runs, backtest_metrics, backtest_fold_metrics]
  measured_s: 27

case_studies/cme_futures/14_portfolio_management:
  parameters:
    EXECUTION_TIER: preview
    PREVIEW_LABELS: ["fwd_ret_5d"]
    # One, not six: shortlist_signal_configurations wants exactly this many DISTINCT
    # (family, config_name) pairs and raises when the pool holds fewer. A smoke chain that
    # backtests three predictions of one configuration has one. Asking for more here does not
    # produce more, it fails the run.
    PREVIEW_MAX_BASELINE_ROWS: 1
  writes: [backtest_runs, backtest_metrics, candidate_sets, candidate_set_members]
  measured_s: 28

case_studies/cme_futures/15_risk_management:
