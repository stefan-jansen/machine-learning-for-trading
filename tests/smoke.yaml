# --- crypto_perps_funding and etfs: what is not declared yet, and why -------------------------
#
# crypto's 07_gbm reads its label through study.labels.get(), which resolves the artifact against
# the ACTIVE OUTPUT ROOT rather than the study root - so a preview looks for
# <workspace>/crypto_perps_funding/labels/fwd_ret_8h.parquet and finds nothing, while the label
# sits behind the worktree's symlink where open_study says inputs are read in place. Seven
# notebooks call that accessor. cme's 07_gbm passes, so the two case studies reach it differently
# and the difference has to be understood before the resolver is touched.
#
# crypto's 13_backtest refuses the reduced panel on a real invariant: at eight symbols and one
# fold the decisions advance 1 or 22 settlements against the 1 its 8H horizon declares, from
# calendar gaps of 8h and 7d8h. That is the reduction being wrong for an intraday cadence, not
# the check being wrong. 14, 15 and 16 then correctly refuse for want of a signal backtest in the
# workspace, and 19 needs a SUPERSEDES for its candidate set.

# --- etfs -----------------------------------------------------------------------------------
#
# Primary label fwd_ret_21d. The downstream stages take LABEL singular and reduce with
# MAX_SYMBOLS and a TOP_N_* cap rather than a PREVIEW_* pair, and 12_causal_dml spells its
# reduction as four separate parameters instead of a dict - the placebo floor is the same either
# way. 11_latent_factors is an index over the five 11x notebooks, like cme's 10_latent_factors.

