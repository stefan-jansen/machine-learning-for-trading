case_studies/cme_futures/11_causal_dml:
  parameters:
    EXECUTION_TIER: preview
    # n_placebo must clear MIN_PLACEBO_DRAWS (10) in utils/causal.py. Below it the permutation
    # test is not computed at all, refutation_p registers NULL, and the row is then REGISTERED
    # AND INCOMPLETE - which blocks its own re-run until someone deletes it. The recorded
    # reduction in work/2026-08-21-stocktake/.../preview-model-analysis.sh asks for 5 and hits
    # exactly that. All four fields are required: causal.py refuses a partial declaration.
    PREVIEW_REDUCTIONS: {max_samples: 20000, max_symbols: 12, n_folds: 2, n_placebo: 12}
  writes: [causal_runs]
  measured_s: 17

