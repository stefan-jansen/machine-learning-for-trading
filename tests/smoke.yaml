# --- crypto_perps_funding and etfs: what is not declared yet, and why -------------------------
#
# crypto's and fx's 07_gbm both died at the label read until LabelCatalog.get stopped defaulting
# its execution_tier to canonical. Fixed; both measured green afterwards. Left here because the
# shape recurs: a bare accessor call that re-activates the study at a tier the caller did not ask
# for looks exactly like a missing artifact.
#
# crypto's 13_backtest refuses the reduced panel on a real invariant: at eight symbols and one
# fold the decisions advance 1 or 22 settlements against the 1 its 8H horizon declares, from
# calendar gaps of 8h and 7d8h. That is the reduction being wrong for an intraday cadence, not
# the check being wrong. 14, 15 and 16 then correctly refuse for want of a signal backtest in the
# workspace, and 19 needs a SUPERSEDES for its candidate set.

