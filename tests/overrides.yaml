# Fourteen model-execution blocks here used to declare MAX_FOLDS and MAX_SYMBOLS. The
# notebooks moved their reduction to the shared boundary, which reads PREVIEW_REDUCTIONS,
# so those two names reached nothing and the runs they described as reduced ran in full.
# They now declare no parameters, which is what is true: this job runs them unreduced.
#
# Declaring the reduction properly is not a drop-in replacement, and the attempt is on
# record. The boundary accepts a reduction only under EXECUTION_TIER: preview, and a
# preview writes to a throwaway workspace and is barred from official populations - so
# the next notebook in the same pipeline finds no predictions and the whole case-study
# job fails downstream of the reduced stage. max_symbols: 5 also cuts the cross-section
# hard enough that cme_futures fold 4 loses two feature columns entirely, and the
# notebook correctly refuses. Reducing a stage whose output the next stage consumes
# needs a canonical-tier reduction, which does not exist yet.
# tests/test_pm_helpers.py::test_every_declared_parameter_reaches_its_notebook is the
# gate that stops a dead parameter being declared here again.
