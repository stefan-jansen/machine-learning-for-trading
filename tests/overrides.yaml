case_studies/sp500_equity_option_analytics/11b_ipca:
  # IPCA estimates a 45-characteristic Gamma from the cross-section. Production
  # has 634 symbols; the CI fixture has 23, giving 19-21 assets per date, so at
  # the production N_FACTORS=5 the ALS is under-determined and never reaches
  # tol=1e-6. Measured on fold 0 of the fixture: K=5 and K=3 both still report
  # converged=False after 2000 iterations, and loosening tol to 1e-4 at K=5 does
  # not help either, so this is non-identification and not slow convergence.
  # K=1 does not converge either (still False at 600).
  #
  # K=2 does, well inside the 10,000-iteration default the pinned ml4t-models
  # build already gives every fit on this path. MAX_VARIANT_LABELS drops the
  # non-identified second variant rather than relaxing the guard, which keeps
  # the notebook's own convergence check passing on real fits: the primary
  # label and one variant, four folds, all genuinely converged.
  #
  # But K=2's convergence sat right on the identification boundary: on one
  # dev machine, folds needed anywhere from 259 to 693 of the 10,000-iteration
  # budget at the default factor_ridge/gamma_ridge=1e-6 - and on the CI
  # runner's hardware, the same fixture, same code, same parameters
  # deterministically never converged (reproduced identically across 3
  # attempts, 2026-07-27, ruling out run-to-run jitter: this is a genuine
  # cross-architecture floating-point divergence on a near-singular ALS
  # system, not noise). The real defect is under-regularization, not a
  # convergence budget: _TEST_PRESET_PATCHES["ipca"] (tests/preset_patches.py) now
  # sets factor_ridge/gamma_ridge=1e-2 (up from the model's 1e-6 default),
  # which is test-only Tikhonov regularization on top of the shipped
  # notebook's own K=2/MAX_VARIANT_LABELS choice above - it does not touch
  # production (634 symbols, robustly identified regardless). Measured on
  # this fixture: iterations to convergence dropped from 259-693 to 24-85,
  # and per-fold IC moved by <0.001 versus the unregularized fit, i.e. the
  # measurement is materially unchanged, only the numerics got safer.
  # reruns: 2 stays as a second line of defense, now that
  # pytest-rerunfailures is actually installed in the case-study CI job
  # (.github/workflows/test.yml) - it was a silent no-op before.
  parameters:
    MAX_VARIANT_LABELS: 1
    N_FACTORS: 2
  reruns: 2
  timeout: 600

