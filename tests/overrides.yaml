case_studies/cme_futures/04_model_based_features:
  # MAX_PRODUCTS: 0 - every product, not a sample. 05_evaluation keeps a date only where
  # ten products carry the feature, so a fixture covering three of the thirty leaves the
  # temporal features under the coverage gate and scores nothing.
  #
  # ARIMA_REFIT_FREQ is what bounds this notebook in CI. Neither of the other two levers
  # is available: MAX_PRODUCTS is held at 0 by the coverage gate above, and MAX_FOLDS
  # slices `splits` so a reduced artifact fails 06-09 and 11 at "artifact fold is
  # missing". The job timed out here at the 1800s cell limit on 2026-08-10 (run
  # 31353597681), in the walk-forward cell and not in the FFT one - FFT_WINDOW bounds the
  # spectral features and never bounded this. Re-selecting the ARIMA order annually
  # rather than monthly cuts the stepwise searches twelvefold and leaves the number of
  # forecasts, and so the row count every downstream gate reads, exactly as it was.
  parameters:
    FFT_WINDOW: 126
    MAX_PRODUCTS: 0
    ARIMA_REFIT_FREQ: 252
  timeout: 1800
