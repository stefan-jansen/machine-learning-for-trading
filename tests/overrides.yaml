  # on /opt/ml4t and dies on `No module named 'tensorflow'`.
  kernel_python: /opt/bsts/bin/python
  kernel_launcher: envs/py312/bsts_kernel.py
  parameters:
    MAX_FOMC_EVENTS: 1
    MAX_PLACEBO_DATES: 1
    # The 24-symbol test ETF universe carries neither IEF nor VEA. Keep the
    # production design shape - one bond target, two international controls,
    # one commodity control - on symbols the fixture does carry, rather than
    # widening the shared universe and shifting the ~14 other notebooks that
    # call load_etfs() with no symbol filter.
    TARGET_ETF: TLT
    CONTROL_ETFS:
